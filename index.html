<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>幸運大轉盤</title>
    <style>
        body { background-color: #0f0a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; color: white; }
        .container { background-color: #d62828; padding: 20px; border-radius: 20px; text-align: center; width: 350px; border: 5px solid #ffba08; position: relative; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        
        .item { 
            background: #ffea00; color: black; padding: 5px; border-radius: 10px; 
            font-weight: bold; border: 4px solid transparent; transition: 0.1s;
            display: flex; align-items: center; justify-content: center; overflow: hidden; height: 80px; position: relative;
        }
        .item img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .item.active { border: 4px solid #ffffff; transform: scale(1.05); background-color: #fff; }
        
        .center-btn { grid-column: 2; grid-row: 2; display: flex; align-items: center; justify-content: center; }
        button { background-color: #2a9d8f; color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; border: 3px solid white; }
        
        /* 中獎彈窗樣式 */
        #result-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 100;
        }
        #result-box { background: white; padding: 30px; border-radius: 20px; text-align: center; color: black; transform: scale(0); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #result-box.show { transform: scale(1); }
    </style>
</head>
<body>

<div class="container">
    <h1>幸運大轉盤</h1>
    <div class="grid" id="wheel">
        <div class="item" data-index="0"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR2ptZLZssvOY6rWjBYvPam7bYpV6jYOibf7w&s"></div>
        <div class="item" data-index="1">獎項2</div>
        <div class="item" data-index="2">獎項3</div>
        <div class="item" data-index="7">獎項8</div>
        <div class="center-btn"><button id="btn" onclick="startSpin()">開始</button></div>
        <div class="item" data-index="3">獎項4</div>
        <div class="item" data-index="6">獎項7</div>
        <div class="item" data-index="5">獎項6</div>
        <div class="item" data-index="4">獎項5</div>
    </div>
</div>

<div id="result-overlay" onclick="closeResult()">
    <div id="result-box">
        <h2>恭喜獲得！</h2>
        <div id="result-content" style="font-size: 24px; margin: 20px 0;"></div>
        <button onclick="closeResult()">關閉</button>
    </div>
</div>

<script>
    const items = document.querySelectorAll('.item');
    const overlay = document.getElementById('result-overlay');
    const resultBox = document.getElementById('result-box');
    const resultContent = document.getElementById('result-content');

    async function startSpin() {
        document.getElementById('btn').disabled = true;
        const totalSteps = 20 + Math.floor(Math.random() * 8);
        let currentStep = 0;
        let speed = 100;

        function play() {
            items.forEach(i => i.classList.remove('active'));
            const idx = currentStep % 8; // 對應 0-7
            const activeItem = document.querySelector(`.item[data-index="${idx}"]`);
            if (activeItem) activeItem.classList.add('active');

            if (currentStep < totalSteps) {
                if (currentStep > totalSteps - 8) speed += 100;
                currentStep++;
                setTimeout(play, speed);
            } else {
                // 顯示結果
                setTimeout(() => {
                    resultContent.innerHTML = activeItem.innerHTML + "<br>獎項 " + (idx + 1);
                    overlay.style.display = 'flex';
                    setTimeout(() => resultBox.classList.add('show'), 50);
                }, 500);
            }
        }
        play();
    }

    function closeResult() {
        resultBox.classList.remove('show');
        setTimeout(() => {
            overlay.style.display = 'none';
            document.getElementById('btn').disabled = false;
        }, 300);
    }
</script>
</body>
</html>
